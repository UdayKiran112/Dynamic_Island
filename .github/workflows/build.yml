name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore DynamicIsland.sln

      - name: Build
        run: dotnet build DynamicIsland.sln -c Release --no-restore

      - name: Publish single-file
        run: >
          dotnet publish src/DynamicIsland/DynamicIsland.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-win-x64
          path: publish/DynamicIsland.exe
